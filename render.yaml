services:
  - type: web
    name: vibe-store
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput"
    preDeployCommand: "python manage.py migrate && python manage.py seed_data"
    startCommand: "gunicorn config.wsgi --workers 2"
    healthCheckPath: /
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "vibe-store.onrender.com,127.0.0.1,localhost"
      - key: DJANGO_SECRET_KEY
        generateValue: true